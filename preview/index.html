<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLTIA - Visor de sprites</title>
<style>
  :root { --bg:#181624; --panel:#222033; --cyan:#96ffeb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#181624; color:#eee;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { text-align:center; padding:20px 12px 8px; max-width:900px; }
  header h1 { margin:0; color:#ffcb3d; letter-spacing:2px; }
  header p { margin:6px 0 0; color:#96ffeb; }
  header p.notes { color:#9d9ab5; font-size:14px; }
  header p.notes b { color:#ffcb3d; }
  main { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; padding:16px;
         width:100%; max-width:1200px; }
  .stage { background:#222033; border:2px solid #3a3752; border-radius:12px; padding:16px;
           display:flex; flex-direction:column; align-items:center; gap:12px; }
  canvas#anim { image-rendering:pixelated; border-radius:8px;
    background: repeating-conic-gradient(#2c2a40 0 25%, #242233 0 50%) 0 0/32px 32px; }
  canvas#anim.solid { background:#101018; }
  canvas#anim.magenta { background:#c0c; }
  canvas#anim.green { background:#00ff00; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button, select { background:#35324e; color:#eee; border:1px solid #4a4767; border-radius:8px;
    padding:8px 12px; cursor:pointer; font-size:14px; }
  button:hover, select:hover { background:#454163; }
  button.active { background:#0e7c8c; border-color:#96ffeb; color:#fff; }
  .anims { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .info { color:#9d9ab5; font-size:14px; }
  .info b { color:#ffcb3d; }
  canvas#strip { image-rendering:pixelated; border-radius:8px; max-width:100%;
    background: repeating-conic-gradient(#2c2a40 0 25%, #242233 0 50%) 0 0/24px 24px; }
  footer { color:#6d6b85; font-size:13px; padding:10px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>⚡ VOLTIA ⚡</h1>
  <p id="ver">cargando…</p>
  <p class="notes" id="notes"></p>
</header>
<main>
  <div class="stage">
    <canvas id="anim"></canvas>
    <div class="controls">
      <button id="play">⏸ Pausar</button>
      <button id="step">⏭ Frame</button>
      <select id="scale">
        <option value="1">Escala 1x (arte)</option>
        <option value="2" selected>Escala 2x</option>
        <option value="4">Escala 4x</option>
      </select>
      <select id="bg">
        <option value="">Fondo: cuadrícula</option>
        <option value="solid">Fondo: oscuro</option>
        <option value="magenta">Fondo: magenta</option>
        <option value="green">Fondo: verde (chroma)</option>
      </select>
    </div>
    <div class="info" id="info"></div>
    <canvas id="strip"></canvas>
  </div>
  <div class="stage">
    <div class="anims" id="anims"></div>
    <div class="info">Consejo: <b>magenta</b> y <b>verde</b> sirven para comprobar la transparencia y el chroma.</div>
  </div>
</main>
<footer id="foot">FabaterFighter</footer>
<script>
(async () => {
  const meta = await (await fetch('../voltia/sheet.json')).json();
  const sheet = new Image();
  sheet.src = '../voltia/' + meta.sprite;
  await sheet.decode();

  const cell = meta.cell;              // {w,h} en px de hoja (uniform_scale)
  const unit = meta.art.uniform_scale; // px-hoja por px-arte
  const total = meta.animations.reduce((n, a) => n + a.frames, 0);
  document.getElementById('ver').textContent =
    `Vista v${meta.version || 'dev'} · canon v${meta.canon || '?'} · ${meta.date || ''} · ` +
    `${meta.rows} animaciones · ${total} frames · de pie ~${meta.art.height_px}px-arte`;
  document.getElementById('notes').innerHTML =
    meta.notes ? `Contenido: <b>${meta.notes}</b>` : '';
  document.getElementById('foot').innerHTML =
    `FabaterFighter · hoja <b>voltia/${meta.sprite}</b> + <b>voltia/sheet.json</b> · versión en <b>voltia/VERSION</b>`;

  const cv = document.getElementById('anim');
  cv.width = cell.w; cv.height = cell.h;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  const strip = document.getElementById('strip');
  const sx = strip.getContext('2d');
  sx.imageSmoothingEnabled = false;
  const info = document.getElementById('info');
  const box = document.getElementById('anims');

  let cur = 0, frame = 0, playing = true, last = performance.now(), acc = 0;

  function setScale() {
    const s = +document.getElementById('scale').value;
    cv.style.width = (cell.w * s / unit) + 'px';
    cv.style.height = (cell.h * s / unit) + 'px';
  }
  document.getElementById('scale').onchange = setScale;
  setScale();
  document.getElementById('bg').onchange = e => { cv.className = e.target.value; };
  document.getElementById('play').onclick = e => {
    playing = !playing;
    e.target.textContent = playing ? '⏸ Pausar' : '▶ Reproducir';
  };
  document.getElementById('step').onclick = () => {
    playing = false;
    document.getElementById('play').textContent = '▶ Reproducir';
    frame = (frame + 1) % meta.animations[cur].frames;
  };

  meta.animations.forEach((a, i) => {
    const b = document.createElement('button');
    b.textContent = `${String(i + 1).padStart(2, '0')} ${a.label}`;
    b.onclick = () => select(i);
    box.appendChild(b);
  });

  function drawStrip() {
    const a = meta.animations[cur];
    strip.width = a.frames * cell.w;
    strip.height = cell.h;
    sx.clearRect(0, 0, strip.width, strip.height);
    for (let f = 0; f < a.frames; f++)
      sx.drawImage(sheet, f * cell.w, a.row * cell.h, cell.w, cell.h,
                   f * cell.w, 0, cell.w, cell.h);
    strip.style.width = Math.min(strip.width, 560) + 'px';
    strip.style.height = 'auto';
    info.innerHTML = `<b>${a.label}</b> · fila ${a.row} · ${a.frames} frames @ ${a.fps}fps · ${a.loop ? 'loop' : 'una vez'}`;
  }

  function select(i) {
    cur = i; frame = 0; acc = 0;
    [...box.children].forEach((b, j) => b.classList.toggle('active', j === i));
    drawStrip();
  }

  function loop(t) {
    const a = meta.animations[cur];
    if (playing) {
      acc += t - last;
      const step = 1000 / a.fps;
      while (acc >= step) {
        acc -= step;
        frame++;
        if (frame >= a.frames) frame = a.loop ? 0 : a.frames - 1;
      }
    }
    last = t;
    cx.clearRect(0, 0, cell.w, cell.h);
    cx.drawImage(sheet, frame * cell.w, a.row * cell.h, cell.w, cell.h,
                 0, 0, cell.w, cell.h);
    requestAnimationFrame(loop);
  }

  select(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
