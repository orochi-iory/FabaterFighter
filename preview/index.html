<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOLTIA - Visor de sprites</title>
<style>
  :root { --bg:#181624; --panel:#222033; --cyan:#96ffeb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:#181624; color:#eee;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  header { text-align:center; padding:20px 12px 8px; }
  header h1 { margin:0; color:#ffcb3d; letter-spacing:2px; }
  header p { margin:6px 0 0; color:#96ffeb; }
  main { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; padding:16px;
         width:100%; max-width:1100px; }
  .stage { background:#222033; border:2px solid #3a3752; border-radius:12px; padding:16px;
           display:flex; flex-direction:column; align-items:center; gap:12px; }
  canvas#anim { image-rendering:pixelated; border-radius:8px;
    background: repeating-conic-gradient(#2c2a40 0 25%, #242233 0 50%) 0 0/32px 32px; }
  canvas#anim.solid { background:#101018; }
  canvas#anim.magenta { background:#c0c; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button, select { background:#35324e; color:#eee; border:1px solid #4a4767; border-radius:8px;
    padding:8px 12px; cursor:pointer; font-size:14px; }
  button:hover, select:hover { background:#454163; }
  button.active { background:#0e7c8c; border-color:#96ffeb; color:#fff; }
  .anims { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .info { color:#9d9ab5; font-size:14px; }
  .info b { color:#ffcb3d; }
  canvas#strip { image-rendering:pixelated; border-radius:8px; max-width:100%;
    background: repeating-conic-gradient(#2c2a40 0 25%, #242233 0 50%) 0 0/24px 24px; }
  footer { color:#6d6b85; font-size:13px; padding:10px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>⚡ VOLTIA ⚡</h1>
  <p>Tilesheet 64×64 · 12 movimientos · 49 frames</p>
</header>
<main>
  <div class="stage">
    <canvas id="anim" width="64" height="64"></canvas>
    <div class="controls">
      <button id="play">⏸ Pausar</button>
      <button id="step">⏭ Frame</button>
      <select id="scale">
        <option value="4">Escala 4x</option>
        <option value="6" selected>Escala 6x</option>
        <option value="8">Escala 8x</option>
      </select>
      <select id="bg">
        <option value="">Fondo: cuadrícula</option>
        <option value="solid">Fondo: oscuro</option>
        <option value="magenta">Fondo: magenta</option>
      </select>
    </div>
    <div class="info" id="info"></div>
    <canvas id="strip" width="384" height="64"></canvas>
  </div>
  <div class="stage">
    <div class="anims" id="anims"></div>
    <div class="info">Consejo: el <b>magenta</b> sirve para comprobar la transparencia.</div>
  </div>
</main>
<footer>FabaterFighter · sprites generados proceduralmente · mira <b>assets/voltia_spritesheet.json</b> para integrar en tu motor</footer>
<script>
(async () => {
  const meta = await (await fetch('../assets/voltia_spritesheet.json')).json();
  const sheet = new Image();
  sheet.src = '../assets/voltia_spritesheet.png';
  await sheet.decode();

  const cell = meta.cell;
  const cv = document.getElementById('anim');
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  const strip = document.getElementById('strip');
  const sx = strip.getContext('2d');
  sx.imageSmoothingEnabled = false;
  const info = document.getElementById('info');
  const box = document.getElementById('anims');

  let cur = 0, frame = 0, playing = true, last = performance.now(), acc = 0;

  function setScale() {
    const s = +document.getElementById('scale').value;
    cv.style.width = cv.style.height = (cell * s) + 'px';
  }
  document.getElementById('scale').onchange = setScale;
  setScale();
  document.getElementById('bg').onchange = e => { cv.className = e.target.value; };
  document.getElementById('play').onclick = e => {
    playing = !playing;
    e.target.textContent = playing ? '⏸ Pausar' : '▶ Reproducir';
  };
  document.getElementById('step').onclick = () => {
    playing = false;
    document.getElementById('play').textContent = '▶ Reproducir';
    frame = (frame + 1) % meta.animations[cur].frames;
  };

  meta.animations.forEach((a, i) => {
    const b = document.createElement('button');
    b.textContent = `${String(i + 1).padStart(2, '0')} ${a.label}`;
    b.onclick = () => select(i);
    box.appendChild(b);
  });

  function drawStrip() {
    const a = meta.animations[cur];
    strip.width = a.frames * cell;
    sx.clearRect(0, 0, strip.width, 64);
    for (let f = 0; f < a.frames; f++)
      sx.drawImage(sheet, f * cell, a.row * cell, cell, cell, f * cell, 0, cell, cell);
    strip.style.width = Math.min(strip.width * 2, 520) + 'px';
    strip.style.height = 'auto';
    info.innerHTML = `<b>${a.label}</b> · fila ${a.row} · ${a.frames} frames @ ${a.fps}fps · ${a.loop ? 'loop' : 'una vez'}`;
  }

  function select(i) {
    cur = i; frame = 0; acc = 0;
    [...box.children].forEach((b, j) => b.classList.toggle('active', j === i));
    drawStrip();
  }

  function loop(t) {
    const a = meta.animations[cur];
    if (playing) {
      acc += t - last;
      const step = 1000 / a.fps;
      while (acc >= step) {
        acc -= step;
        frame++;
        if (frame >= a.frames) frame = a.loop ? 0 : a.frames - 1;
      }
    }
    last = t;
    cx.clearRect(0, 0, cell, cell);
    cx.drawImage(sheet, frame * cell, a.row * cell, cell, cell, 0, 0, cell, cell);
    requestAnimationFrame(loop);
  }

  select(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
